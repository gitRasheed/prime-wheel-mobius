name: Rename modules and rebuild paper

on:
  push:
    branches:
      - agent/rename-public-lean-modules

permissions:
  contents: write

jobs:
  rename-build-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/rename-public-lean-modules
          fetch-depth: 0

      - name: Rename modules and update references
        shell: bash
        run: |
          set -euo pipefail

          git mv \
            formalization/RHLean/Analysis/SquarePrefixMertensBridge.lean \
            formalization/RHLean/Analysis/MertensEnergyCriterion.lean
          git mv \
            formalization/RHLean/Analysis/PrimeWheelExplicitCriterion.lean \
            formalization/RHLean/Analysis/PrimorialWheelExplicitCriterion.lean

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          old_to_new = {
              "SquarePrefixMertensBridge": "MertensEnergyCriterion",
              "PrimeWheelExplicitCriterion": "PrimorialWheelExplicitCriterion",
          }

          tracked = subprocess.check_output(
              ["git", "grep", "-Il", "-e", "SquarePrefixMertensBridge", "-e", "PrimeWheelExplicitCriterion"],
              text=True,
          ).splitlines()

          for name in tracked:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in old_to_new.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          manifest = Path("docs/SOURCE_MANIFEST.md")
          text = manifest.read_text(encoding="utf-8")
          old_section = """## Public adapters

          The export replaces two sandbox-coupled bridge modules with minimal public adapters at the same module paths:

          - `RHLean/Analysis/MertensEnergyCriterion.lean` defines only the Mertens summatory function and squared growth criterion required by the exact reduction.
          - `RHLean/Analysis/PrimeWheelRHBridge.lean` names Mathlib's `RiemannHypothesis` proposition and keeps the classical Mertens/RH theorem as an explicit argument.
          """
          new_section = """## Public bridge foundations

          The public export uses role-specific module names rather than reusing sandbox-coupled internal paths whose names describe different theorem layers:

          - `RHLean/Analysis/MertensEnergyCriterion.lean` defines the Mertens summatory function and squared growth criterion required by the exact reduction.
          - `RHLean/Analysis/PrimeWheelRHBridge.lean` names Mathlib's `RiemannHypothesis` proposition and keeps the classical Mertens/RH theorem as an explicit argument.
          """
          if old_section not in text:
              raise SystemExit("Expected public-adapter manifest section was not found")
          text = text.replace(old_section, new_section)
          manifest.write_text(text, encoding="utf-8")

          stale = subprocess.run(
              ["git", "grep", "-n", "-e", "SquarePrefixMertensBridge", "-e", "PrimeWheelExplicitCriterion"],
              text=True,
              capture_output=True,
          )
          if stale.returncode == 0:
              raise SystemExit("Stale module names remain:\n" + stale.stdout)
          if stale.returncode != 1:
              raise SystemExit(stale.stderr)
          PY

      - name: Audit unfinished proofs and project-local axioms
        working-directory: formalization
        run: bash scripts/audit_assumptions.sh

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formalization
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Build public formalization
        working-directory: formalization
        run: lake build RHLean --wfail

      - name: Install LaTeX and PDF verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-latex-extra \
            texlive-fonts-recommended \
            qpdf \
            poppler-utils

      - name: Compile updated paper PDF
        working-directory: paper
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error \
            seeded_prime_comb_harmonic_reduction.tex

      - name: Refresh manuscript provenance hash
        shell: bash
        run: |
          set -euo pipefail
          hash=$(sha256sum paper/seeded_prime_comb_harmonic_reduction.tex | awk '{print $1}')
          python3 - "$hash" <<'PY'
          from pathlib import Path
          import re
          import sys

          new_hash = sys.argv[1]
          path = Path("docs/SOURCE_MANIFEST.md")
          text = path.read_text(encoding="utf-8")
          text, count = re.subn(
              r"(?<=Manuscript SHA-256 at export assembly: `)[0-9a-f]{64}(?=`\.)",
              new_hash,
              text,
          )
          if count != 1:
              raise SystemExit(f"Expected one manuscript hash, replaced {count}")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify generated PDF and hyperlink target
        shell: bash
        run: |
          set -euo pipefail
          pdf=paper/seeded_prime_comb_harmonic_reduction.pdf
          test -s "$pdf"
          pdfinfo "$pdf" | tee /tmp/paper-pdfinfo.txt
          qpdf --check "$pdf"
          qpdf --qdf --object-streams=disable "$pdf" /tmp/paper-expanded.pdf
          grep -a -q 'PrimorialWheelExplicitCriterion' /tmp/paper-expanded.pdf
          if grep -a -q 'PrimeWheelExplicitCriterion' /tmp/paper-expanded.pdf; then
            echo 'Stale hyperlink target remains in generated PDF' >&2
            exit 1
          fi

      - name: Remove temporary workflow and commit results
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/rename-modules-and-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/SOURCE_MANIFEST.md \
            formalization/RHLean.lean \
            formalization/RHLean/Analysis \
            formalization/RHLean/Arithmetic/PrimorialWheelPrefixIdentity.lean \
            paper/seeded_prime_comb_harmonic_reduction.tex \
            paper/seeded_prime_comb_harmonic_reduction.pdf
          git commit -m 'Rename public Lean modules and regenerate paper'
          git push origin HEAD:agent/rename-public-lean-modules
